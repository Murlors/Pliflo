name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install Cairo and Pango
        run: brew install pkgconf cairo pango

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun run check

      - name: Check native code
        run: cargo test --workspace --locked

      - name: Check recording protocol
        run: bun run test:protocol

      - name: Build application with native libraries
        run: bun run desktop:build

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          tar -czf "Pliflo_${RELEASE_TAG}_${BUILD_ARCH}.app.tar.gz" -C src-tauri/target/release/bundle/macos Pliflo.app
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "Pliflo $RELEASE_TAG" --generate-notes || gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "Pliflo_${RELEASE_TAG}_${BUILD_ARCH}.app.tar.gz" src-tauri/target/release/bundle/dmg/*.dmg
