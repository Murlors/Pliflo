name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS universal
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun run check

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pliflo ${{ github.ref_name }}"
          releaseBody: |
            Pliflo 1.1 makes the local multi-format batch-printing workflow substantially more usable for large and mixed document batches.

            Supported sources include PDF, DOCX, PPTX, XLSX, Markdown, PNG, JPG/JPEG, WebP, GIF and BMP. Non-PDF documents are prepared incrementally into printable PDFs, with bounded preparation, cancellation and lossless PNG page transfer over Tauri binary IPC to reduce frontend memory pressure on large files.

            See the README for current platform support and printing behavior.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
