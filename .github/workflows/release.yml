name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  font-diagnostics:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: Inspect native font files
        run: |
          brew install fontconfig
          swift -e 'import Foundation; import CoreText; let font = CTFontCreateWithName("PingFang SC" as CFString, 12, nil); if let url = CTFontCopyAttribute(font, kCTFontURLAttribute) as? URL { print(url.path) }' > /tmp/pliflo-font-path
          while IFS= read -r font; do
            ls -l "$font"
            fc-scan --format '%{family}\n%{postscriptname}\n' "$font"
          done < /tmp/pliflo-font-path
          swift -e 'import Foundation; import CoreText; for url in CTFontManagerCopyAvailableFontURLs() as! [URL] where url.path.contains("PingFang") { print(url.path) }'
  macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install Cairo and Pango
        run: brew install pkgconf cairo pango

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun x --no-install vp run check

      - name: Check recording protocol
        run: bun x --no-install vp run test:protocol

      - name: Build application with native libraries
        run: bun x --no-install vp run desktop:build

      - name: Check native code
        run: bun x --no-install vp run test:native --release

      - name: Upload release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "Pliflo $RELEASE_TAG" --generate-notes || gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/dmg/*.dmg
