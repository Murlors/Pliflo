[package]
name = "pliflo"
version = "1.0.0"
description = "A focused local document batch printing desktop app"
authors = ["Pliflo"]
edition = "2021"

[lib]
name = "pliflo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
png = "0.17"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
lopdf = "0.38"
